name: Temporary PCA SRS cadence verification
on:
  push:
    branches: [feat/srs-cadence-parity]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test dev/test_srs_cadence.mjs
