name: Apply PCA SRS modernization
on:
  push:
    branches: [feat/srs-cadence-modernization]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: "!contains(github.event.head_commit.message, '[srs-modernized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/srs-cadence-modernization
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Port current Duff cadence and relearn model
        shell: bash
        run: |
          cat > js/domain/srs/constants.js <<'EOF'
          // SRS scheduling constants — kept aligned with the current Duff study tool.
          // An N-day interval is due in 24N - 2 hours: day 1 is 22h so a daily
          // review lands slightly earlier, while later days are full 24h days.
          export const SRS_DAY_MS = 22 * 60 * 60 * 1000;
          export const SRS_FULL_DAY_MS = 24 * 60 * 60 * 1000;
          export const SRS_AGAIN_MS = 5 * 60 * 1000; // legacy/exported; spaced Hard now routes through middle due-now
          export const SRS_UNCERTAIN_MIN_MS = 2 * 60 * 60 * 1000;
          export const SRS_UNCERTAIN_MAX_MS = 7 * 24 * 60 * 60 * 1000;
          export const SRS_UNCERTAIN_CAP_MS = SRS_UNCERTAIN_MIN_MS; // legacy alias
          export const SRS_UNSPACED_RECOVERY_MS = 60 * 60 * 1000;
          export const SRS_MAX_INTERVAL_DAYS = 14;

          // Lapse / relearn ladder. Hard relearns in-session, then gets two
          // one-day confirmations before resuming at half the pre-lapse interval.
          export const SRS_RELEARN_STEP_DAYS = 1;
          export const SRS_HARD_RELEARN_STEPS = 2;

          // Leech protection is enabled only in the long-horizon cadence.
          export const LEECH_LAPSE_THRESHOLD = 4;
          export const LEECH_UNPIN_STREAK = 3;
          export const LEECH_DRILL_DAYS = 1;

          export const SRS_CADENCE_PRESETS = {
            intensive: {
              id: 'intensive',
              label: '2-month intensive',
              maxIntervalDays: SRS_MAX_INTERVAL_DAYS,
              lapseResumeCapDays: 7,
              easyCurve: { high: 2.5, midBase: 1.5, midDiv: 40, lowBase: 1.2, lowDiv: 100 },
              leechEnabled: false,
              useCardDifficulty: false,
            },
            relaxed: {
              id: 'relaxed',
              label: '8-month / continuous review',
              maxIntervalDays: 60,
              maxEasyStepDays: 14,
              lapseResumeCapDays: 14,
              easyCurve: { high: 2.0, midBase: 1.5, midDiv: 40, lowBase: 1.3, lowDiv: 40 },
              leechEnabled: true,
              useCardDifficulty: true,
              difficultyNeutralEase: 2.3,
            },
          };
          export const DEFAULT_SRS_CADENCE = 'intensive';
          export function getCadencePreset(id) {
            return SRS_CADENCE_PRESETS[id] || SRS_CADENCE_PRESETS[DEFAULT_SRS_CADENCE];
          }

          export const SRS_NEAR_WINDOW_MS = 30 * 60 * 1000;
          export const SRS_CYCLE_ADVANCE_MS = 60 * 60 * 1000;
          export const SESSION_IDLE_RESET_MS = 5 * 60 * 60 * 1000;
          EOF

          cat > js/domain/srs/scheduler.js <<'EOF'
          // SRS scheduling logic — pure functions, no state access.
          import {
            SRS_DAY_MS, SRS_FULL_DAY_MS, SRS_AGAIN_MS, SRS_UNCERTAIN_MIN_MS,
            SRS_UNSPACED_RECOVERY_MS, SRS_MAX_INTERVAL_DAYS,
            DEFAULT_SRS_CADENCE, getCadencePreset,
          } from './constants.js';
          import { clamp } from '../../utils/helpers.js';
          import { getConfidencePct } from './confidence.js';

          const DEFAULT_CADENCE = getCadencePreset(DEFAULT_SRS_CADENCE);

          function easyMultiplierFor(recentPct, curve) {
            if (recentPct >= 90) return curve.high;
            if (recentPct >= 70) return curve.midBase + (recentPct - 70) / curve.midDiv;
            return curve.lowBase + (recentPct - 50) / curve.lowDiv;
          }

          export function msFromDays(days) {
            if (!(days > 0)) return 0;
            if (days <= 1) return Math.round(days * SRS_DAY_MS);
            return Math.round(SRS_DAY_MS + (days - 1) * SRS_FULL_DAY_MS);
          }
          export function daysFromMs(ms) {
            if (!(ms > 0)) return 0;
            if (ms <= SRS_DAY_MS) return ms / SRS_DAY_MS;
            return 1 + (ms - SRS_DAY_MS) / SRS_FULL_DAY_MS;
          }
          export function msFromHours(hours) { return Math.round(hours * 60 * 60 * 1000); }
          export function setProgressDelay(progress, delayMs, now = Date.now()) {
            progress.intervalDays = daysFromMs(delayMs);
            progress.dueAt = now + delayMs;
          }
          export function getRemainingProgressDelayMs(progress, now = Date.now()) {
            if (!progress || !progress.dueAt) return 0;
            return Math.max(0, progress.dueAt - now);
          }
          export function setMinimumProgressDelay(progress, minimumDelayMs, now = Date.now()) {
            const remainingDelayMs = getRemainingProgressDelayMs(progress, now);
            if (remainingDelayMs < minimumDelayMs) {
              setProgressDelay(progress, minimumDelayMs, now);
              return true;
            }
            progress.intervalDays = daysFromMs(remainingDelayMs);
            return false;
          }
          export function getSrsEase(progress) {
            const rawEase = Number(progress?.ease);
            const safeEase = Number.isFinite(rawEase) ? rawEase : 2.3;
            progress.ease = clamp(safeEase, 1.3, 3.0);
            return progress.ease;
          }
          export function getSrsStage(progress) {
            const rawStage = Number(progress?.srsStage);
            return Number.isFinite(rawStage) ? Math.max(0, Math.floor(rawStage)) : 0;
          }
          export function getLastEasyIntervalDays(progress) {
            const rawDays = Number(progress?.lastEasyIntervalDays);
            return Number.isFinite(rawDays) ? Math.max(0, rawDays) : 0;
          }

          export function getNextEasyIntervalDays(progress, cadence = DEFAULT_CADENCE) {
            const history = Array.isArray(progress?.confidenceHistory)
              ? progress.confidenceHistory.filter(Number.isFinite) : [];
            const recentPct = history.length
              ? (history.reduce((s, v) => s + v, 0) / history.length) * 100 : 0;
            if (history.length < 5 || recentPct < 50) return 1;

            let multiplier = easyMultiplierFor(recentPct, cadence.easyCurve);
            if (cadence.useCardDifficulty) {
              const neutralEase = cadence.difficultyNeutralEase || 2.3;
              multiplier *= getSrsEase(progress) / neutralEase;
            }
            const previousDays = Math.max(
              1,
              getLastEasyIntervalDays(progress),
              Number.isFinite(Number(progress?.intervalDays)) ? Math.max(0, Number(progress.intervalDays)) : 0,
            );
            const proposedDays = previousDays * multiplier;
            const minNext = Math.ceil(previousDays + 1);
            let cappedDays = Math.min(cadence.maxIntervalDays, Math.max(Math.round(proposedDays), minNext));
            if (Number.isFinite(cadence.maxEasyStepDays)) {
              cappedDays = Math.min(cappedDays, Math.max(minNext, Math.round(previousDays + cadence.maxEasyStepDays)));
            }
            return cappedDays;
          }
          export function getEasyDelayMs(progress, cadence = DEFAULT_CADENCE) {
            return msFromDays(getNextEasyIntervalDays(progress, cadence));
          }

          // Retained for older callers; the modern spaced-review flow uses the
          // explicit relearn ladder in app/srs.js instead.
          export function getRecentUncertainCeilingMs(progress, { capDays = 7, floorMs = 0 } = {}) {
            const history = Array.isArray(progress?.confidenceHistory)
              ? progress.confidenceHistory.filter(Number.isFinite) : [];
            const last3 = history.slice(-3);
            if (!last3.length || !last3.some(value => value < 1)) return null;
            const certainty = last3.reduce((sum, value) => sum + value, 0) / last3.length;
            return Math.max(floorMs, msFromDays(capDays * certainty));
          }
          export function getUncertainDelayMs(progress) {
            const pct = getConfidencePct(progress);
            if (pct === null || pct < 70) return SRS_UNCERTAIN_MIN_MS;
            const prevIntervalDays = Number(progress?.intervalDays) || 0;
            if (prevIntervalDays <= 0) return SRS_UNCERTAIN_MIN_MS;
            const halfMs = msFromDays(prevIntervalDays * 0.5);
            const rawCeiling = getRecentUncertainCeilingMs(progress) ?? msFromDays(SRS_MAX_INTERVAL_DAYS);
            return clamp(halfMs, SRS_UNCERTAIN_MIN_MS, Math.max(rawCeiling, SRS_UNCERTAIN_MIN_MS));
          }

          export function formatRemainingForTable(dueAt) {
            const now = Date.now();
            if (!dueAt || dueAt <= now) return 'now';
            const remaining = dueAt - now;
            if (remaining > 12 * 60 * 60 * 1000) return `${Math.max(1, Math.ceil(daysFromMs(remaining)))}d`;
            if (remaining >= 60 * 60 * 1000) return `${Math.max(1, Math.ceil(remaining / 3600000))}h`;
            return `${Math.max(1, Math.ceil(remaining / 60000))}m`;
          }

          export function applyUnspacedSchedule(progress, cycleEntry, outcome, reviewedAt = Date.now()) {
            const normalizedOutcome = outcome === 'easy' ? 'easy' : outcome === 'pass' ? 'pass' : 'again';
            if (normalizedOutcome === 'again') {
              cycleEntry.wrongThisCycle = true;
              cycleEntry.lastOutcome = 'again';
              setProgressDelay(progress, SRS_AGAIN_MS, reviewedAt);
              return progress;
            }
            const recoveringFromMiss = cycleEntry.wrongThisCycle;
            const minimumDelayMs = (normalizedOutcome === 'pass' || recoveringFromMiss)
              ? SRS_UNSPACED_RECOVERY_MS : SRS_DAY_MS;
            cycleEntry.correctCount += 1;
            cycleEntry.lastOutcome = normalizedOutcome;
            setMinimumProgressDelay(progress, minimumDelayMs, reviewedAt);
            return progress;
          }
          EOF

          cat > js/app/srs.js <<'EOF'
          // Applies a self-check / quiz outcome to card SRS progress, then persists
          // and logs the review. The spaced path mirrors the current Duff engine.
          import {
            SRS_UNCERTAIN_MIN_MS, SRS_RELEARN_STEP_DAYS, SRS_HARD_RELEARN_STEPS,
            LEECH_LAPSE_THRESHOLD, LEECH_UNPIN_STREAK, LEECH_DRILL_DAYS,
            getCadencePreset,
          } from '../domain/srs/constants.js';
          import {
            setProgressDelay, getNextEasyIntervalDays, msFromDays,
            getLastEasyIntervalDays, getSrsStage, getSrsEase,
          } from '../domain/srs/scheduler.js';
          import { recordConfidenceSample, getConfidencePct, computeCardXpAward } from '../domain/srs/confidence.js';
          import { clamp } from '../utils/helpers.js';
          import { state, getProgress, saveProgress, recordActivity, addXp } from './store.js';

          function preLapseIntervalDays(progress) {
            return Math.max(getLastEasyIntervalDays(progress), Number(progress.intervalDays) || 0);
          }
          function applyEasyGrowth(progress, cadence, now) {
            const nextIntervalDays = getNextEasyIntervalDays(progress, cadence);
            progress.streak = (progress.streak || 0) + 1;
            progress.easyStreak = (progress.easyStreak || 0) + 1;
            progress.srsStage = getSrsStage(progress) + 1;
            progress.ease = clamp(getSrsEase(progress) + 0.08, 1.3, 3.0);
            progress.lastEasyIntervalDays = nextIntervalDays;
            progress.firstConfirmedAt = progress.firstConfirmedAt || now;
            setProgressDelay(progress, msFromDays(nextIntervalDays), now);
          }
          function resumeAfterLapse(progress, cadence, now) {
            const resumeDays = clamp(
              preLapseIntervalDays(progress) * 0.5,
              SRS_RELEARN_STEP_DAYS,
              cadence.lapseResumeCapDays,
            );
            progress.inRelearn = false;
            progress.relearnLeft = 0;
            progress.streak = (progress.streak || 0) + 1;
            progress.easyStreak = (progress.easyStreak || 0) + 1;
            progress.lastEasyIntervalDays = resumeDays;
            setProgressDelay(progress, msFromDays(resumeDays), now);
          }
          function applyHardLapse(progress, cadence, now) {
            const wasInRelearn = progress.inRelearn === true;
            const wasLeech = progress.leechDrill === true;
            const establishedDays = preLapseIntervalDays(progress);
            const startsLapseEpisode = !wasInRelearn && !wasLeech && establishedDays > 0;

            progress.streak = 0;
            progress.easyStreak = 0;
            if (startsLapseEpisode) {
              progress.srsStage = Math.max(0, getSrsStage(progress) - 1);
              progress.ease = clamp(getSrsEase(progress) - 0.2, 1.3, 3.0);
              progress.lapseCount = (progress.lapseCount || 0) + 1;
              progress.preLapseIntervalDays = establishedDays;
            }

            const shouldLeech = cadence.leechEnabled && (
              wasLeech || (startsLapseEpisode && progress.lapseCount >= LEECH_LAPSE_THRESHOLD)
            );
            if (shouldLeech) {
              progress.leechDrill = true;
              progress.leechStreak = 0;
              progress.inRelearn = false;
              progress.relearnLeft = 0;
              setProgressDelay(progress, 0, now);
              return true;
            }

            if (!wasInRelearn) progress.preLapseIntervalDays = establishedDays;
            progress.inRelearn = true;
            progress.relearnLeft = SRS_HARD_RELEARN_STEPS;
            setProgressDelay(progress, 0, now); // due-now; deck rebuild routes it through middle
            return true;
          }
          function applyUncertainLapse(progress, now) {
            if (!progress.inRelearn) progress.preLapseIntervalDays = preLapseIntervalDays(progress);
            progress.inRelearn = true;
            progress.relearnLeft = 0;
            progress.streak = (progress.streak || 0) + 1;
            progress.easyStreak = 0;
            setProgressDelay(progress, SRS_UNCERTAIN_MIN_MS, now);
          }
          function applyCorrectOutcome(progress, cadence, now, ratedOutcome) {
            if (progress.leechDrill) {
              progress.leechStreak = (progress.leechStreak || 0) + 1;
              if (progress.leechStreak < LEECH_UNPIN_STREAK) {
                progress.streak = (progress.streak || 0) + 1;
                setProgressDelay(progress, msFromDays(LEECH_DRILL_DAYS), now);
                return;
              }
              progress.leechDrill = false;
              progress.leechStreak = 0;
              progress.lapseCount = 0;
              progress.lastEasyIntervalDays = LEECH_DRILL_DAYS;
              applyEasyGrowth(progress, cadence, now);
              return;
            }
            if (progress.inRelearn) {
              if ((progress.relearnLeft || 0) > 0) {
                progress.relearnLeft -= 1;
                progress.streak = (progress.streak || 0) + 1;
                setProgressDelay(progress, msFromDays(SRS_RELEARN_STEP_DAYS), now);
                return;
              }
              resumeAfterLapse(progress, cadence, now);
              return;
            }
            if (ratedOutcome === 'pass') {
              applyUncertainLapse(progress, now);
              return;
            }
            applyEasyGrowth(progress, cadence, now);
          }

          export function applyOutcome(card, outcome) {
            if (!state.spacedOn) {
              addXp(computeCardXpAward(outcome, false, false));
              recordActivity();
              return;
            }
            const p = getProgress(card.id);
            const now = Date.now();
            const ratedOutcome = outcome === 'pass' ? 'pass' : outcome === 'easy' ? 'easy' : 'again';
            const cadence = getCadencePreset(state.spacingCadence);
            const wasConfirmed = !!p.firstConfirmedAt;
            recordConfidenceSample(p, ratedOutcome);
            if (!p.firstConfirmedAt) {
              const pct = getConfidencePct(p);
              if (pct !== null && pct >= 70) p.firstConfirmedAt = now;
            }
            addXp(computeCardXpAward(ratedOutcome, !wasConfirmed && !!p.firstConfirmedAt, true));

            if (ratedOutcome === 'again') {
              const dropFromActive = applyHardLapse(p, cadence, now);
              if (dropFromActive && Array.isArray(state.spacedActiveIds)) {
                state.spacedActiveIds = state.spacedActiveIds.filter(id => id !== card.id);
              }
              p.failCount = (p.failCount || 0) + 1;
            } else {
              applyCorrectOutcome(p, cadence, now, ratedOutcome);
              p.passCount = (p.passCount || 0) + 1;
            }
            p.reps = (p.reps || 0) + 1;
            p.lastReviewedAt = now;
            saveProgress();
            recordActivity();
          }

          // Catechism grading remains a confidence/mastery signal, independent
          // of the subject-deck SRS cadence and the global spaced toggle.
          export function applyCatechismOutcome(id, outcome) {
            const p = getProgress(id);
            const now = Date.now();
            const wasConfirmed = !!p.firstConfirmedAt;
            recordConfidenceSample(p, outcome);
            if (!p.firstConfirmedAt) {
              const pct = getConfidencePct(p);
              if (pct !== null && pct >= 70) p.firstConfirmedAt = now;
            }
            if (outcome === 'easy') p.passCount = (p.passCount || 0) + 1;
            else if (outcome === 'again') p.failCount = (p.failCount || 0) + 1;
            p.reps = (p.reps || 0) + 1;
            p.lastReviewedAt = now;
            addXp(computeCardXpAward(outcome, !wasConfirmed && !!p.firstConfirmedAt, true));
            saveProgress();
            recordActivity();
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Persistence/state: add a cadence preference, defaulting existing users
          # to the historical intensive behavior.
          p=Path('js/app/store.js'); s=p.read_text()
          s=s.replace("export const SPACED_KEY = 'pca_spaced_v1';", "export const SPACED_KEY = 'pca_spaced_v1';\nexport const SPACING_CADENCE_KEY = 'pca_spacing_cadence_v1';")
          s=s.replace("  spacedOn: true,          // spaced-repetition master switch (persisted); off = unspaced\n", "  spacedOn: true,          // spaced-repetition master switch (persisted); off = unspaced\n  spacingCadence: 'intensive', // 'intensive' (2-month, default) | 'relaxed' (8-month/continuous)\n")
          marker="export function saveSpaced() {\n  try { localStorage.setItem(SPACED_KEY, state.spacedOn ? 'on' : 'off'); } catch (e) {}\n}\n"
          insert=marker+"export function loadSpacingCadence() {\n  // Preserve the historical 2-month behavior unless the user explicitly opts into 8-month.\n  try { state.spacingCadence = localStorage.getItem(SPACING_CADENCE_KEY) === 'relaxed' ? 'relaxed' : 'intensive'; }\n  catch (e) { state.spacingCadence = 'intensive'; }\n}\nexport function saveSpacingCadence() {\n  try { localStorage.setItem(SPACING_CADENCE_KEY, state.spacingCadence === 'relaxed' ? 'relaxed' : 'intensive'); } catch (e) {}\n}\n"
          if marker not in s: raise SystemExit('store saveSpaced marker missing')
          s=s.replace(marker,insert,1)
          old="p = { confidenceHistory: [], intervalDays: 0, dueAt: 0, ease: 2.3, passCount: 0, failCount: 0, reps: 0, lastReviewedAt: 0 };"
          new="p = { confidenceHistory: [], intervalDays: 0, dueAt: 0, ease: 2.3, srsStage: 0, streak: 0, easyStreak: 0, lastEasyIntervalDays: 0, lapseCount: 0, inRelearn: false, relearnLeft: 0, preLapseIntervalDays: 0, leechDrill: false, leechStreak: 0, passCount: 0, failCount: 0, reps: 0, lastReviewedAt: 0 };"
          if old not in s: raise SystemExit('store getProgress default marker missing')
          s=s.replace(old,new,1); p.write_text(s)

          # Controller wiring + UI state.
          p=Path('js/app/pca.js'); s=p.read_text()
          s=s.replace("  loadSpaced, saveSpaced, loadUnspacedReset, saveUnspacedReset, loadUnspaced, saveUnspaced,", "  loadSpaced, saveSpaced, loadSpacingCadence, saveSpacingCadence, loadUnspacedReset, saveUnspacedReset, loadUnspaced, saveUnspaced,")
          toggle_marker="function toggleUnspacedReset() {"
          cadence_fn="""function setSpacingCadence(value) {
            const next = value === 'relaxed' ? 'relaxed' : 'intensive';
            if (state.spacingCadence === next) return;
            state.spacingCadence = next;
            saveSpacingCadence();
            updateAdvancedButtons();
            // Existing dueAt timestamps remain untouched; the selected cadence
            // governs the next review outcome onward.
            renderReviewPanel();
          }
          """
          if toggle_marker not in s: raise SystemExit('pca toggle marker missing')
          s=s.replace(toggle_marker,cadence_fn+toggle_marker,1)
          adv="  setToggle('spacedToggle', 'spacedBtn', state.spacedOn, false);\n"
          adv_new=adv+"  syncToggleActive('[data-srs-cadence]', 'data-srs-cadence', state.spacingCadence);\n"
          if adv not in s: raise SystemExit('pca advanced marker missing')
          s=s.replace(adv,adv_new,1)
          s=s.replace("  loadSpaced();\n", "  loadSpaced();\n  loadSpacingCadence();\n",1)
          wcf_listener="  document.querySelectorAll('[data-wcf-detail]').forEach(b =>\n    b.addEventListener('click', () => setWcfDetail(b.getAttribute('data-wcf-detail'))));\n"
          cadence_listener=wcf_listener+"  document.querySelectorAll('[data-srs-cadence]').forEach(b =>\n    b.addEventListener('click', () => setSpacingCadence(b.getAttribute('data-srs-cadence'))));\n"
          if wcf_listener not in s: raise SystemExit('pca WCF listener marker missing')
          s=s.replace(wcf_listener,cadence_listener,1)
          p.write_text(s)

          # Settings UI: make the master toggle cadence-neutral and add the two-option cadence selector.
          p=Path('index.html'); s=p.read_text()
          s=s.replace("title=\"Spaced repetition. On schedules each card by how well you know it and only resurfaces it when it's due — the 2-month / 14-day cadence. Off is unspaced: study the whole selection ignoring the schedule, marking cards until they're cleared (reps are still logged for your streak and XP).\"", "title=\"Spaced repetition. On schedules each card by how well you know it and only resurfaces it when it's due; choose the 2-month or 8-month cadence below. Off is unspaced: study the whole selection ignoring the schedule, marking cards until they're cleared (reps are still logged for your streak and XP).\"")
          needle='''      <button class="toggle-label" id="unspacedResetToggle" type="button" role="switch" aria-checked="true"'''
          cadence='''      <div class="display-prefs-row" id="srsCadenceRow">
                <span class="display-prefs-label">SRS cadence</span>
                <div class="theme-switcher" role="group" aria-label="Spaced repetition cadence">
                  <button class="theme-btn active" id="srsIntensiveBtn" type="button" data-srs-cadence="intensive" title="2-month intensive: the historical PCA schedule, with a 14-day maximum interval and no leech drill.">2-month</button>
                  <button class="theme-btn" id="srsRelaxedBtn" type="button" data-srs-cadence="relaxed" title="8-month / continuous review: intervals can grow to 60 days; repeated genuine lapses of established cards use the Duff leech recovery drill.">8-month</button>
                </div>
              </div>
          '''
          if needle not in s: raise SystemExit('index cadence insertion marker missing')
          s=s.replace(needle,cadence+needle,1)
          s=s.replace('?v=73','?v=74')
          p.write_text(s)

          # Release cache bump.
          p=Path('sw.js'); s=p.read_text().replace("const CACHE = 'pca-v73';", "const CACHE = 'pca-v74';"); p.write_text(s)

          # Keep the repo's architecture notes accurate.
          p=Path('CLAUDE.md'); s=p.read_text()
          old="The\n  SRS engine uses Duff's *intensive* 2-month cadence (14-day cap) only — the\n  8-month relaxed preset/toggle is deliberately not imported."
          new="The\n  SRS engine now exposes both current Duff cadence presets: **2-month intensive**\n  remains the default for existing users (14-day cap), while **8-month / continuous**\n  is opt-in (60-day cap, per-card ease, relearn/leech protection)."
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('PROJECT_PLAN.md')
          with p.open('a') as f:
            f.write("\n\n### SRS cadence modernization — 2026-10-07\n- Ported the current Duff 2-month / 8-month cadence model into the subject-deck SRS. Existing users remain on 2-month unless they opt into 8-month in Advanced settings.\n- Hard now follows Duff's in-session relearn path (middle/due-now), and the 8-month preset enables leech handling only for genuine repeated lapses of established cards.\n")
          PY

          cat > dev/test_srs_cadence.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { state, getProgress } from '../js/app/store.js';
          import { applyOutcome } from '../js/app/srs.js';
          import { getCadencePreset } from '../js/domain/srs/constants.js';
          import { getNextEasyIntervalDays, msFromDays } from '../js/domain/srs/scheduler.js';

          const realNow = Date.now;
          function reset(now = 1_800_000_000_000) {
            state.spacedOn = true;
            state.spacingCadence = 'relaxed';
            state.progress = {};
            state.spacedActiveIds = [];
            state.activity = {};
            state.xp = 0;
            Date.now = () => now;
          }
          try {
            reset();
            assert.equal(state.spacingCadence, 'relaxed');
            const fresh = { id: 'fresh' };
            for (let n = 0; n < 6; n++) {
              const now = 1_800_000_000_000 + n * 1000;
              Date.now = () => now;
              state.spacedActiveIds = ['fresh'];
              applyOutcome(fresh, 'again');
              const p = getProgress('fresh');
              assert.equal(p.dueAt, now, 'Hard should stay due-now for the middle-deck loop');
              assert.equal(p.lapseCount || 0, 0, 'fresh retries are not lapses');
              assert.equal(p.leechDrill, false);
              assert.deepEqual(state.spacedActiveIds, []);
            }

            reset();
            const id = 'known';
            state.progress[id] = {
              confidenceHistory: [1,1,1,1,1], intervalDays: 14, lastEasyIntervalDays: 14,
              ease: 2.3, srsStage: 4, streak: 5, easyStreak: 5,
              lapseCount: 3, inRelearn: false, relearnLeft: 0,
              preLapseIntervalDays: 14, leechDrill: false, leechStreak: 2,
              passCount: 5, failCount: 3, reps: 8, dueAt: 0,
            };
            state.spacedActiveIds = [id];
            applyOutcome({ id }, 'again');
            let p = getProgress(id);
            assert.equal(p.lapseCount, 4);
            assert.equal(p.leechDrill, true);
            assert.equal(p.dueAt, Date.now());
            assert.deepEqual(state.spacedActiveIds, []);
            const nextNow = Date.now() + 1000;
            Date.now = () => nextNow;
            applyOutcome({ id }, 'again');
            p = getProgress(id);
            assert.equal(p.lapseCount, 4, 'same leech/relearn episode must not add another lapse');
            assert.equal(p.dueAt, nextNow);

            reset();
            state.spacingCadence = 'intensive';
            state.progress[id] = {
              confidenceHistory: [1,1,1,1,1], intervalDays: 14, lastEasyIntervalDays: 14,
              ease: 2.3, srsStage: 4, lapseCount: 3, inRelearn: false, leechDrill: false,
            };
            applyOutcome({ id }, 'again');
            p = getProgress(id);
            assert.equal(p.lapseCount, 4);
            assert.notEqual(p.leechDrill, true, '2-month cadence must not enable the leech drill');

            const relaxed = getCadencePreset('relaxed');
            const growth = { confidenceHistory: Array(10).fill(1), intervalDays: 14, lastEasyIntervalDays: 14, ease: 2.3 };
            assert.equal(getNextEasyIntervalDays(growth, relaxed), 28);
            growth.intervalDays = 28; growth.lastEasyIntervalDays = 28;
            assert.equal(getNextEasyIntervalDays(growth, relaxed), 42);
            assert.equal(msFromDays(1), 22 * 60 * 60 * 1000);
            assert.equal(msFromDays(2), 46 * 60 * 60 * 1000);

            console.log('OK — PCA SRS cadence/relearn regression tests passed');
          } finally {
            Date.now = realNow;
          }
          EOF
